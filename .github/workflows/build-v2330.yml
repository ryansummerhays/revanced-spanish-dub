name: Build Spanish Dub Study v2.33.0 Sherpa Neural Diarization Proof

on:
  workflow_dispatch:
  push:
    branches:
      - release/v2.33.0-sherpa-neural-diarization-proof

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout custom integration
        uses: actions/checkout@v4

      - name: Checkout pinned Morphe patches
        uses: actions/checkout@v4
        with:
          repository: MorpheApp/morphe-patches
          ref: v1.41.0
          path: upstream
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate patch scripts
        run: |
          python3 -m py_compile \
            scripts/patch_v2323_pcm_counter_english_source.py \
            scripts/audit_v2323_pcm_counter_english_source.py \
            scripts/patch_v2324_pcm_metadata_stage_b.py \
            scripts/audit_v2324_pcm_metadata_stage_b.py \
            scripts/patch_v2325_pcm_sample_read_stage_c.py \
            scripts/audit_v2325_pcm_sample_read_stage_c.py \
            scripts/patch_v2326_audiotrack_format_stage_d.py \
            scripts/audit_v2326_audiotrack_format_stage_d.py \
            scripts/patch_v2327_pcm16_vad_stage_e.py \
            scripts/audit_v2327_pcm16_vad_stage_e.py \
            scripts/patch_v2328_speaker_features_stage_f.py \
            scripts/audit_v2328_speaker_features_stage_f.py \
            scripts/patch_v2329_online_clustering_stage_g.py \
            scripts/audit_v2329_online_clustering_stage_g.py \
            scripts/patch_v23210_live_cluster_label_stage_h.py \
            scripts/audit_v23210_live_cluster_label_stage_h.py \
            scripts/patch_v23211_spanish_voice_toggle_stage_i.py \
            scripts/audit_v23211_spanish_voice_toggle_stage_i.py \
            scripts/patch_v23212_per_video_speaker_reset_stage_j.py \
            scripts/audit_v23212_per_video_speaker_reset_stage_j.py \
            scripts/patch_v2330_sherpa_neural_proof.py \
            scripts/audit_v2330_sherpa_neural_proof.py

      - name: Test retained core helpers
        run: |
          rm -rf /tmp/spanish-study-old && mkdir -p /tmp/spanish-study-old
          javac -d /tmp/spanish-study-old \
            overlay/src/app/spanishstudy/vot/DubTextSanitizer.java \
            overlay/src/app/spanishstudy/vot/OpenRouterOutputGuard.java \
            overlay/v216/app/spanishstudy/vot/OpenRouterBudget.java \
            overlay/v230/app/spanishstudy/vot/DubLanguageGuard.java \
            overlay/v224/app/spanishstudy/vot/SubtitlePagePolicy.java \
            overlay/v223/app/spanishstudy/vot/BilingualCardPolicy.java \
            overlay/v225/app/spanishstudy/vot/SubtitleLinePolicy.java \
            tests/DubTextSanitizerTest.java \
            tests/OpenRouterOutputGuardTest.java \
            tests/OpenRouterBudgetV216Test.java \
            tests/DubLanguageGuardV230Test.java \
            tests/SubtitlePagePolicyV220Test.java \
            tests/SubtitleCardSizeV224Test.java \
            tests/BilingualCardPolicyV223Test.java \
            tests/SubtitleLinePolicyV225Test.java
          java -cp /tmp/spanish-study-old app.spanishstudy.vot.DubTextSanitizerTest
          java -cp /tmp/spanish-study-old app.spanishstudy.vot.OpenRouterOutputGuardTest
          java -cp /tmp/spanish-study-old app.spanishstudy.vot.OpenRouterBudgetV216Test
          java -cp /tmp/spanish-study-old app.spanishstudy.vot.DubLanguageGuardV230Test
          java -cp /tmp/spanish-study-old app.spanishstudy.vot.SubtitlePagePolicyV220Test
          java -cp /tmp/spanish-study-old app.spanishstudy.vot.SubtitleCardSizeV224Test
          java -cp /tmp/spanish-study-old app.spanishstudy.vot.BilingualCardPolicyV223Test
          java -cp /tmp/spanish-study-old app.spanishstudy.vot.SubtitleLinePolicyV225Test

      - name: Test v2.31 conversational display helpers
        run: |
          rm -rf /tmp/spanish-study-v231 && mkdir -p /tmp/spanish-study-v231
          javac -d /tmp/spanish-study-v231 \
            overlay/v231/app/spanishstudy/vot/SubtitlePagePolicy.java \
            overlay/v231/app/spanishstudy/vot/BilingualCardPolicy.java \
            tests/ConversationalSubtitleV231Test.java
          java -cp /tmp/spanish-study-v231 app.spanishstudy.vot.ConversationalSubtitleV231Test

      - name: Apply retained v2.28 through Stage J
        run: |
          python3 scripts/patch_v2280_deep_diagnostics_local_diarization.py upstream .
          python3 scripts/tune_v2280_local_speaker.py upstream
          python3 scripts/audit_v2280_deep_diagnostics_local_diarization.py upstream
          python3 scripts/patch_v2290_stability.py upstream .
          python3 scripts/audit_v2290_stability.py upstream
          python3 scripts/patch_v2300_runtime_stability.py upstream .
          python3 scripts/audit_v2300_runtime_stability.py upstream
          python3 scripts/patch_v2310_conversational_subtitles.py upstream .
          python3 scripts/audit_v2310_conversational_subtitles.py upstream
          python3 scripts/patch_v2322_label_only.py upstream
          python3 scripts/audit_v2322_label_only.py upstream
          python3 scripts/patch_v2323_pcm_counter_english_source.py upstream
          python3 scripts/audit_v2323_pcm_counter_english_source.py upstream
          python3 scripts/patch_v2324_pcm_metadata_stage_b.py upstream
          python3 scripts/audit_v2324_pcm_metadata_stage_b.py upstream
          python3 scripts/patch_v2325_pcm_sample_read_stage_c.py upstream
          python3 scripts/audit_v2325_pcm_sample_read_stage_c.py upstream
          python3 scripts/patch_v2326_audiotrack_format_stage_d.py upstream
          python3 scripts/audit_v2326_audiotrack_format_stage_d.py upstream
          python3 scripts/patch_v2327_pcm16_vad_stage_e.py upstream
          python3 scripts/audit_v2327_pcm16_vad_stage_e.py upstream
          python3 scripts/patch_v2328_speaker_features_stage_f.py upstream
          python3 scripts/audit_v2328_speaker_features_stage_f.py upstream
          python3 scripts/patch_v2329_online_clustering_stage_g.py upstream
          python3 scripts/audit_v2329_online_clustering_stage_g.py upstream
          python3 scripts/patch_v23210_live_cluster_label_stage_h.py upstream
          python3 scripts/audit_v23210_live_cluster_label_stage_h.py upstream
          python3 scripts/patch_v23211_spanish_voice_toggle_stage_i.py upstream
          python3 scripts/audit_v23211_spanish_voice_toggle_stage_i.py upstream
          python3 scripts/patch_v23212_per_video_speaker_reset_stage_j.py upstream
          python3 scripts/audit_v23212_per_video_speaker_reset_stage_j.py upstream

      - name: Record sacred Morphe files before neural proof
        run: |
          sha256sum \
            upstream/extensions/youtube/src/main/java/app/morphe/extension/youtube/patches/voiceovertranslation/TranscriptFetcher.java \
            upstream/extensions/youtube/src/main/java/app/morphe/extension/youtube/patches/voiceovertranslation/TranscriptTranslator.java \
            upstream/extensions/youtube/src/main/java/app/morphe/extension/youtube/patches/voiceovertranslation/TtsPrefetcher.java \
            upstream/extensions/youtube/src/main/java/app/morphe/extension/youtube/patches/voiceovertranslation/TtsEngine.java \
            upstream/extensions/youtube/src/main/java/app/spanishstudy/vot/SpanishSubtitleOverlay.java \
            upstream/extensions/youtube/src/main/java/app/spanishstudy/vot/SpanishStudyPrefs.java \
            upstream/extensions/youtube/src/main/java/app/spanishstudy/vot/SpanishStudySheet.java \
            upstream/patches/src/main/kotlin/app/morphe/patches/youtube/video/volume/PlayerVolumeHookPatch.kt \
            > /tmp/v2330-sacred.sha

      - name: Fetch pinned official sherpa Android runtime and models
        shell: bash
        run: |
          set -euo pipefail
          AAR=/tmp/sherpa-onnx-1.13.7.aar
          curl -L --fail --retry 4 -o "$AAR" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar
          echo "c4ef49e309f24fcee5c106b8a279481aaecaabb078cd37b2cd6e9a62cc8a73c8  $AAR" | sha256sum -c -

          rm -rf /tmp/sherpa-aar /tmp/sherpa-seg
          mkdir -p /tmp/sherpa-aar /tmp/sherpa-seg \
            upstream/extensions/youtube/libs \
            upstream/extensions/youtube/src/main/jniLibs/arm64-v8a \
            upstream/extensions/youtube/src/main/assets/spanishstudy/sherpa
          unzip -q "$AAR" -d /tmp/sherpa-aar
          cp /tmp/sherpa-aar/classes.jar upstream/extensions/youtube/libs/sherpa-onnx-1.13.7-classes.jar
          cp /tmp/sherpa-aar/jni/arm64-v8a/*.so upstream/extensions/youtube/src/main/jniLibs/arm64-v8a/

          jar tf upstream/extensions/youtube/libs/sherpa-onnx-1.13.7-classes.jar | grep 'com/k2fsa/sherpa/onnx/OfflineSpeakerDiarization.class'
          test -f upstream/extensions/youtube/src/main/jniLibs/arm64-v8a/libsherpa-onnx-jni.so
          test -f upstream/extensions/youtube/src/main/jniLibs/arm64-v8a/libonnxruntime.so

          SEG_ARCHIVE=/tmp/sherpa-pyannote3.tar.bz2
          curl -L --fail --retry 4 -o "$SEG_ARCHIVE" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2
          test "$(stat -c%s "$SEG_ARCHIVE")" = "6958444"
          tar xjf "$SEG_ARCHIVE" -C /tmp/sherpa-seg
          SEG_MODEL="$(find /tmp/sherpa-seg -type f -name model.onnx | head -n1)"
          test -n "$SEG_MODEL"
          cp "$SEG_MODEL" upstream/extensions/youtube/src/main/assets/spanishstudy/sherpa/segmentation.onnx

          EMB=upstream/extensions/youtube/src/main/assets/spanishstudy/sherpa/embedding.onnx
          curl -L --fail --retry 4 -o "$EMB" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx
          test "$(stat -c%s "$EMB")" = "39593761"

          echo "Sherpa ARM64 payload:"
          ls -lh upstream/extensions/youtube/src/main/jniLibs/arm64-v8a/
          echo "Sherpa models:"
          ls -lh upstream/extensions/youtube/src/main/assets/spanishstudy/sherpa/

      - name: Apply v2.33.0 sherpa neural proof
        run: |
          python3 scripts/patch_v2330_sherpa_neural_proof.py upstream
          python3 scripts/audit_v2330_sherpa_neural_proof.py upstream
          sha256sum -c /tmp/v2330-sacred.sha

      - name: Build Morphe patch bundle with neural payload
        working-directory: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid --no-daemon

      - name: Verify extension build contains sherpa runtime and models
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_v2330_sherpa_neural_proof.py upstream
          sha256sum -c /tmp/v2330-sacred.sha
          echo "Extension outputs containing neural payload:"
          find upstream/extensions/youtube/build -type f \( -name '*.apk' -o -name '*.zip' \) -print || true
          APK="$(find upstream/extensions/youtube/build -type f -name '*.apk' | head -n1 || true)"
          if [ -n "$APK" ]; then
            unzip -l "$APK" | grep 'lib/arm64-v8a/libsherpa-onnx-jni.so'
            unzip -l "$APK" | grep 'lib/arm64-v8a/libonnxruntime.so'
            unzip -l "$APK" | grep 'assets/spanishstudy/sherpa/segmentation.onnx'
            unzip -l "$APK" | grep 'assets/spanishstudy/sherpa/embedding.onnx'
          else
            echo "No standalone extension APK exposed by build task; source payload audit passed and MPP packaging continues."
          fi

      - name: Package v2.33.0 neural proof
        run: |
          mkdir -p dist
          python3 - <<'PY2'
          import glob,time,zipfile
          srcs=glob.glob('upstream/patches/build/libs/*.mpp')
          if len(srcs)!=1: raise SystemExit(f'Expected one MPP, found {srcs}')
          src=srcs[0]; dst='dist/spanish-dub-study-patches-v2.33.0-sherpa-neural-proof.mpp'
          manifest=f'''Manifest-Version: 1.0\nName: Spanish Dub Study Patches v2.33.0 Sherpa Neural Proof\nDescription: Parallel one-shot local neural diarization proof using official sherpa-onnx 1.13.7, pyannote segmentation 3.0, ERes2Net speaker embeddings, and automatic FastClustering. Collects 20 seconds from the proven 48kHz stereo PCM16 YouTube AudioTrack stream, downsamples to 16kHz mono, and runs inference off the audio thread. Stage-J live badge authority remains unchanged. Morphe sentence segmentation, OpenRouter 1500/350 packetization/order, subtitles and Edge TTS are unchanged.\nVersion: 2.33.0-sherpa-neural-proof\nTimestamp: {int(time.time()*1000)}\nSource: https://github.com/ryansummerhays/revanced-spanish-dub\nAuthor: ryansummerhays\nContact: na\nWebsite: https://github.com/ryansummerhays/revanced-spanish-dub\nLicense: GNU General Public License v3.0, with additional GPL section 7 requirements\nPatcher-Version: 1.10.0\n\n'''.encode()
          with zipfile.ZipFile(src,'r') as zin, zipfile.ZipFile(dst,'w') as zout:
              for info in zin.infolist():
                  zout.writestr(info, manifest if info.filename=='META-INF/MANIFEST.MF' else zin.read(info.filename))
          PY2
          cd dist
          sha256sum *.mpp > spanish-dub-study-patches-v2.33.0-sherpa-neural-proof-SHA256SUMS.txt
          cat spanish-dub-study-patches-v2.33.0-sherpa-neural-proof-SHA256SUMS.txt

      - name: Upload v2.33.0 neural proof bundle
        uses: actions/upload-artifact@v4
        with:
          name: spanish-dub-study-patches-v2.33.0-sherpa-neural-proof-final
          path: dist/
          if-no-files-found: error
          retention-days: 30
