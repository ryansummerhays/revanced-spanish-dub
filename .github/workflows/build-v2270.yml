name: Build Spanish Dub Study v2.27.0 stock Morphe + passive subtitles

on:
  workflow_dispatch:
  push:
    branches:
      - release/v2.27.0-stock-morphe-mistral-subtitles

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout custom integration
        uses: actions/checkout@v4

      - name: Checkout pinned Morphe patches
        uses: actions/checkout@v4
        with:
          repository: MorpheApp/morphe-patches
          ref: v1.41.0
          path: upstream
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Test display-only pagination policies
        run: |
          rm -rf /tmp/spanish-study-test && mkdir -p /tmp/spanish-study-test
          javac -d /tmp/spanish-study-test \
            overlay/v224/app/spanishstudy/vot/SubtitlePagePolicy.java \
            overlay/v223/app/spanishstudy/vot/BilingualCardPolicy.java \
            overlay/v225/app/spanishstudy/vot/SubtitleLinePolicy.java \
            tests/SubtitlePagePolicyV220Test.java \
            tests/SubtitleCardSizeV224Test.java \
            tests/BilingualCardPolicyV223Test.java \
            tests/SubtitleLinePolicyV225Test.java
          java -cp /tmp/spanish-study-test app.spanishstudy.vot.SubtitlePagePolicyV220Test
          java -cp /tmp/spanish-study-test app.spanishstudy.vot.SubtitleCardSizeV224Test
          java -cp /tmp/spanish-study-test app.spanishstudy.vot.BilingualCardPolicyV223Test
          java -cp /tmp/spanish-study-test app.spanishstudy.vot.SubtitleLinePolicyV225Test

      - name: Apply stock-Morphe passive subtitle integration
        run: |
          python3 scripts/patch_v2270_stock_morphe_subtitles.py upstream .
          python3 scripts/audit_v2270_stock_morphe_subtitles.py upstream

      - name: Build Morphe patch bundle
        working-directory: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid --no-daemon

      - name: Package v2.27.0
        run: |
          mkdir -p dist
          python3 - <<'PY2'
          import glob,time,zipfile
          srcs=glob.glob('upstream/patches/build/libs/*.mpp')
          if len(srcs)!=1: raise SystemExit(f'Expected one MPP, found {srcs}')
          src=srcs[0]; dst='dist/spanish-dub-study-patches-v2.27.0.mpp'
          manifest=f'''Manifest-Version: 1.0\nName: Spanish Dub Study Patches v2.27.0\nDescription: Returns the audible VOT pipeline to pristine Morphe v1.41.0. TranscriptTranslator, TtsEngine, TtsPrefetcher, TranscriptSegment, source sentence merging, speech rate, seek behavior, Edge synthesis, cache and prefetch are left unmodified. The user's normal Morphe translation provider remains authoritative, so OpenRouter/Mistral can stay selected. Remote speaker diarization and per-speaker voice routing are not packaged. The only study addition is a passive bilingual subtitle layer that observes Morphe's existing source/translated segments, keeps the currently spoken segment visible using Morphe's own playback window, and losslessly paginates long text into synchronized two-line Spanish/English cards instead of clipping it.\nVersion: 2.27.0\nTimestamp: {int(time.time()*1000)}\nSource: https://github.com/ryansummerhays/revanced-spanish-dub\nAuthor: ryansummerhays\nContact: na\nWebsite: https://github.com/ryansummerhays/revanced-spanish-dub\nLicense: GNU General Public License v3.0, with additional GPL section 7 requirements\nPatcher-Version: 1.10.0\n\n'''.encode()
          with zipfile.ZipFile(src,'r') as zin, zipfile.ZipFile(dst,'w') as zout:
              for info in zin.infolist():
                  zout.writestr(info, manifest if info.filename=='META-INF/MANIFEST.MF' else zin.read(info.filename))
          PY2
          cd dist
          sha256sum *.mpp > spanish-dub-study-patches-v2.27.0-SHA256SUMS.txt
          cat spanish-dub-study-patches-v2.27.0-SHA256SUMS.txt

      - name: Upload v2.27.0 bundle
        uses: actions/upload-artifact@v4
        with:
          name: spanish-dub-study-patches-v2.27.0-final
          path: dist/
          if-no-files-found: error
          retention-days: 30
