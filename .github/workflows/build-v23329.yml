name: Build Spanish Dub v2.33.29 Accepted PCM Video Master

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/video-master-clock-v23329

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout custom integration
        uses: actions/checkout@v4

      - name: Checkout pinned Morphe patches
        uses: actions/checkout@v4
        with:
          repository: MorpheApp/morphe-patches
          ref: v1.41.0
          path: upstream
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and audit v2.33.29
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat scripts/v23329r2_patch.b64 | tr -d '\r\n' | base64 -d > scripts/patch_v23329_accepted_pcm_video_master.py.gz
          cat scripts/v23329r2_audit.b64.* | tr -d '\r\n' | base64 -d > scripts/audit_v23329_accepted_pcm_video_master.py.gz
          gzip -t scripts/patch_v23329_accepted_pcm_video_master.py.gz
          gzip -t scripts/audit_v23329_accepted_pcm_video_master.py.gz
          gzip -dc scripts/build_v23329_driver.sh.gz > /tmp/build_v23329_driver.sh
          bash -n /tmp/build_v23329_driver.sh
          bash /tmp/build_v23329_driver.sh

      - name: Upload v2.33.29 source candidate
        uses: actions/upload-artifact@v4
        with:
          name: spanish-dub-v23329-source-candidate-r2
          path: dist/
          if-no-files-found: error
          retention-days: 30
