name: Build Spanish Dub v2.33.45 Calibrated Neighborhood Identity

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/video-master-clock-v23329

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Checkout custom integration
        uses: actions/checkout@v4

      - name: Checkout pinned Morphe patches
        uses: actions/checkout@v4
        with:
          repository: MorpheApp/morphe-patches
          ref: v1.41.0
          path: upstream
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Reconstruct source chain
        run: |
          set -euo pipefail
          cat scripts/v23329r3_patch.b64.* | tr -d '\r\n' | base64 -d > scripts/patch_v23329_accepted_pcm_video_master.py.gz
          cat scripts/v23329r3_audit.b64.* | tr -d '\r\n' | base64 -d > scripts/audit_v23329_accepted_pcm_video_master.py.gz
          gzip -t scripts/patch_v23329_accepted_pcm_video_master.py.gz
          gzip -t scripts/audit_v23329_accepted_pcm_video_master.py.gz

          tr -d '\r\n' < scripts/v23330_patch.b64 | base64 -d > /tmp/patch_v23330.py.gz
          tr -d '\r\n' < scripts/v23330_audit.b64 | base64 -d > /tmp/audit_v23330.py.gz
          gzip -t /tmp/patch_v23330.py.gz /tmp/audit_v23330.py.gz
          gzip -dc /tmp/patch_v23330.py.gz > scripts/patch_v23330_postwrite_register_fix.py
          gzip -dc /tmp/audit_v23330.py.gz > scripts/audit_v23330_postwrite_register_fix.py

          tr -d '\r\n' < scripts/v23338_patch.b64 | base64 -d > /tmp/patch_v23338.py.gz
          tr -d '\r\n' < scripts/v23338_audit.b64 | base64 -d > /tmp/audit_v23338.py.gz
          gzip -t /tmp/patch_v23338.py.gz /tmp/audit_v23338.py.gz
          gzip -dc /tmp/patch_v23338.py.gz > scripts/patch_v23338_episode_evidence_identity.py
          gzip -dc /tmp/audit_v23338.py.gz > scripts/audit_v23338_episode_evidence_identity.py

          tr -d '\r\n' < scripts/v23339_bundle.b64 | base64 -d > /tmp/v23339_bundle.tar.gz
          gzip -t /tmp/v23339_bundle.tar.gz
          tar -xzf /tmp/v23339_bundle.tar.gz -C scripts
          chmod +x scripts/build_v23339_driver.sh

          cat scripts/v23340_bundle.b64.* | tr -d '\r\n' | base64 -d > /tmp/v23340_bundle.tar.gz
          gzip -t /tmp/v23340_bundle.tar.gz
          tar -xzf /tmp/v23340_bundle.tar.gz -C scripts
          chmod +x scripts/build_v23340_driver.sh

          cat scripts/v23341_source.patch.gz.b64.* | tr -d '\r\n' | base64 -d > /tmp/v23341_source.patch.gz
          echo '68d4fbb47c509bc531930af87fe8f6ab0e907b1d8055a58e4f71608bc138c0fe  /tmp/v23341_source.patch.gz' | sha256sum -c -
          gzip -t /tmp/v23341_source.patch.gz
          chmod +x scripts/build_v23341_driver.sh

          cat scripts/v23342r2_source.patch.gz.b64.* | tr -d '\r\n' | base64 -d > /tmp/v23342_source.patch.gz
          echo 'bc76854130069fb0d065fdc52f0c80df2d0e4f4fbabb5662ec9e42519847ff0b  /tmp/v23342_source.patch.gz' | sha256sum -c -
          gzip -t /tmp/v23342_source.patch.gz
          chmod +x scripts/build_v23342_r2_driver.sh

          cat scripts/v23343r2_source.patch.gz.b64.* | tr -d '\r\n' | base64 -d > /tmp/v23343_source.patch.gz
          echo '09b497e650e14458b6605b3e668d3a9dfef397def9a3258042ba793525545378  /tmp/v23343_source.patch.gz' | sha256sum -c -
          gzip -t /tmp/v23343_source.patch.gz
          chmod +x scripts/build_v23343_driver.sh

          cat scripts/v23344_source.patch.gz.b64.* | tr -d '\r\n' | base64 -d > /tmp/v23344_source.patch.gz
          echo 'c56c2e34eabbfb8179acbf529013ae17e24b3a035ed67498fcc478dbbaf057cb  /tmp/v23344_source.patch.gz' | sha256sum -c -
          gzip -t /tmp/v23344_source.patch.gz
          chmod +x scripts/build_v23344_driver.sh

          cat scripts/v23345_source.patch.gz.b64.* | tr -d '\r\n' | base64 -d > /tmp/v23345_source.patch.gz
          echo '9b4c03a03aa778b02c34fce45624170e3fa57d96a669233cb6d5acd7b2bf9000  /tmp/v23345_source.patch.gz' | sha256sum -c -
          gzip -t /tmp/v23345_source.patch.gz
          chmod +x scripts/build_v23345_driver.sh

          python3 scripts/fix_v23336_diagnostic_anchor.py
          python3 -m py_compile scripts/audit_v23345_calibrated_neighborhood.py
          bash -n scripts/build_v23345_driver.sh

      - name: Build and audit v2.33.45
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/build_v23345_driver.sh

      - name: Export reconstructed v2.33.45 source
        run: |
          set -euo pipefail
          mkdir -p dist/reconstructed-v23345
          cp upstream/extensions/youtube/src/main/java/app/spanishstudy/vot/LiveSpeakerOnline.java dist/reconstructed-v23345/
          cp upstream/extensions/youtube/src/main/java/app/spanishstudy/vot/SherpaNeuralShadow.java dist/reconstructed-v23345/
          cp upstream/extensions/youtube/src/main/java/app/spanishstudy/vot/SpanishStudyController.java dist/reconstructed-v23345/
          cp scripts/audit_v23345_calibrated_neighborhood.py dist/reconstructed-v23345/
          cp scripts/v23345_source.patch.gz.b64.* dist/reconstructed-v23345/

      - name: Upload v2.33.45 source candidate
        uses: actions/upload-artifact@v4
        with:
          name: spanish-dub-v23345-source-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 30
