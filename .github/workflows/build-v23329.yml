name: Build Spanish Dub v2.33.41 Clean-Episode Statistical Identity

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/video-master-clock-v23329

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout custom integration
        uses: actions/checkout@v4

      - name: Checkout pinned Morphe patches
        uses: actions/checkout@v4
        with:
          repository: MorpheApp/morphe-patches
          ref: v1.41.0
          path: upstream
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Reconstruct source chain
        run: |
          set -euo pipefail
          cat scripts/v23329r3_patch.b64.* | tr -d '\r\n' | base64 -d > scripts/patch_v23329_accepted_pcm_video_master.py.gz
          cat scripts/v23329r3_audit.b64.* | tr -d '\r\n' | base64 -d > scripts/audit_v23329_accepted_pcm_video_master.py.gz
          gzip -t scripts/patch_v23329_accepted_pcm_video_master.py.gz
          gzip -t scripts/audit_v23329_accepted_pcm_video_master.py.gz

          tr -d '\r\n' < scripts/v23330_patch.b64 | base64 -d > /tmp/patch_v23330.py.gz
          tr -d '\r\n' < scripts/v23330_audit.b64 | base64 -d > /tmp/audit_v23330.py.gz
          gzip -t /tmp/patch_v23330.py.gz /tmp/audit_v23330.py.gz
          gzip -dc /tmp/patch_v23330.py.gz > scripts/patch_v23330_postwrite_register_fix.py
          gzip -dc /tmp/audit_v23330.py.gz > scripts/audit_v23330_postwrite_register_fix.py

          tr -d '\r\n' < scripts/v23338_patch.b64 | base64 -d > /tmp/patch_v23338.py.gz
          tr -d '\r\n' < scripts/v23338_audit.b64 | base64 -d > /tmp/audit_v23338.py.gz
          gzip -t /tmp/patch_v23338.py.gz /tmp/audit_v23338.py.gz
          gzip -dc /tmp/patch_v23338.py.gz > scripts/patch_v23338_episode_evidence_identity.py
          gzip -dc /tmp/audit_v23338.py.gz > scripts/audit_v23338_episode_evidence_identity.py

          tr -d '\r\n' < scripts/v23339_bundle.b64 | base64 -d > /tmp/v23339_bundle.tar.gz
          gzip -t /tmp/v23339_bundle.tar.gz
          tar -tzf /tmp/v23339_bundle.tar.gz
          tar -xzf /tmp/v23339_bundle.tar.gz -C scripts
          chmod +x scripts/build_v23339_driver.sh

          cat scripts/v23340_bundle.b64.* | tr -d '\r\n' | base64 -d > /tmp/v23340_bundle.tar.gz
          gzip -t /tmp/v23340_bundle.tar.gz
          tar -tzf /tmp/v23340_bundle.tar.gz
          tar -xzf /tmp/v23340_bundle.tar.gz -C scripts
          chmod +x scripts/build_v23340_driver.sh

          # v41 is an exact compressed unified diff against the successful reconstructed v40 source.
          tr -d '\r\n' < scripts/v23341_source.patch.gz.b64 | base64 -d > /tmp/v23341_source.patch.gz
          echo '68d4fbb47c509bc531930af87fe8f6ab0e907b1d8055a58e4f71608bc138c0fe  /tmp/v23341_source.patch.gz' | sha256sum -c -
          gzip -t /tmp/v23341_source.patch.gz
          chmod +x scripts/build_v23341_driver.sh

          python3 scripts/fix_v23336_diagnostic_anchor.py
          python3 -m py_compile \
            scripts/patch_v23331_live_speaker.py \
            scripts/patch_v23331_live_speaker_r2.py \
            scripts/patch_v23331_live_speaker_r3.py \
            scripts/audit_v23331_live_speaker.py \
            scripts/patch_v23332_live_identity_collapse_fix.py \
            scripts/audit_v23332_live_identity_collapse_fix.py \
            scripts/patch_v23333_identity_stabilization.py \
            scripts/audit_v23333_identity_stabilization.py \
            scripts/patch_v23334_style_context_recovery.py \
            scripts/audit_v23334_style_context_recovery.py \
            scripts/patch_v23335_badge_translation_integrity.py \
            scripts/audit_v23335_badge_translation_integrity.py \
            scripts/patch_v23336_streaming_context.py \
            scripts/audit_v23336_streaming_context.py \
            scripts/patch_v23337_two_level_identity.py \
            scripts/audit_v23337_two_level_identity.py \
            scripts/patch_v23338_episode_evidence_identity.py \
            scripts/audit_v23338_episode_evidence_identity.py \
            scripts/patch_v23339_segmentation_gate.py \
            scripts/audit_v23339_segmentation_gate.py \
            scripts/patch_v23340_contextual_identity.py \
            scripts/audit_v23340_contextual_identity.py \
            scripts/audit_v23341_clean_episode_statistics.py
          bash -n \
            scripts/build_v23331_driver.sh \
            scripts/build_v23332_driver.sh \
            scripts/build_v23333_driver.sh \
            scripts/build_v23334_driver.sh \
            scripts/build_v23335_driver.sh \
            scripts/build_v23336_driver.sh \
            scripts/build_v23337_driver.sh \
            scripts/build_v23338_driver.sh \
            scripts/build_v23339_driver.sh \
            scripts/build_v23340_driver.sh \
            scripts/build_v23341_driver.sh

      - name: Build and audit v2.33.41
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/build_v23341_driver.sh

      - name: Export reconstructed v2.33.41 source
        run: |
          set -euo pipefail
          mkdir -p dist/reconstructed-v23341
          cp upstream/extensions/youtube/src/main/java/app/spanishstudy/vot/LiveSpeakerOnline.java dist/reconstructed-v23341/
          cp upstream/extensions/youtube/src/main/java/app/spanishstudy/vot/SherpaNeuralShadow.java dist/reconstructed-v23341/
          cp upstream/extensions/youtube/src/main/java/app/spanishstudy/vot/SpanishStudyController.java dist/reconstructed-v23341/
          cp scripts/audit_v23341_clean_episode_statistics.py dist/reconstructed-v23341/
          cp scripts/v23341_source.patch.gz.b64 dist/reconstructed-v23341/

      - name: Upload v2.33.41 source candidate
        uses: actions/upload-artifact@v4
        with:
          name: spanish-dub-v23341-source-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 30
