name: Build Spanish Dub v2.33.47 Confirmed Shadow Singleton Rescue

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/video-master-clock-v23329

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout custom integration
        uses: actions/checkout@v4

      - name: Checkout pinned Morphe patches
        uses: actions/checkout@v4
        with:
          repository: MorpheApp/morphe-patches
          ref: v1.41.0
          path: upstream
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Reconstruct trusted v2.33.45 source chain
        run: |
          set -euo pipefail
          cat scripts/v23329r3_patch.b64.* | tr -d '\r\n' | base64 -d > scripts/patch_v23329_accepted_pcm_video_master.py.gz
          cat scripts/v23329r3_audit.b64.* | tr -d '\r\n' | base64 -d > scripts/audit_v23329_accepted_pcm_video_master.py.gz
          gzip -t scripts/patch_v23329_accepted_pcm_video_master.py.gz
          gzip -t scripts/audit_v23329_accepted_pcm_video_master.py.gz

          tr -d '\r\n' < scripts/v23330_patch.b64 | base64 -d > /tmp/patch_v23330.py.gz
          tr -d '\r\n' < scripts/v23330_audit.b64 | base64 -d > /tmp/audit_v23330.py.gz
          gzip -t /tmp/patch_v23330.py.gz /tmp/audit_v23330.py.gz
          gzip -dc /tmp/patch_v23330.py.gz > scripts/patch_v23330_postwrite_register_fix.py
          gzip -dc /tmp/audit_v23330.py.gz > scripts/audit_v23330_postwrite_register_fix.py

          tr -d '\r\n' < scripts/v23338_patch.b64 | base64 -d > /tmp/patch_v23338.py.gz
          tr -d '\r\n' < scripts/v23338_audit.b64 | base64 -d > /tmp/audit_v23338.py.gz
          gzip -t /tmp/patch_v23338.py.gz /tmp/audit_v23338.py.gz
          gzip -dc /tmp/patch_v23338.py.gz > scripts/patch_v23338_episode_evidence_identity.py
          gzip -dc /tmp/audit_v23338.py.gz > scripts/audit_v23338_episode_evidence_identity.py

          tr -d '\r\n' < scripts/v23339_bundle.b64 | base64 -d > /tmp/v23339_bundle.tar.gz
          gzip -t /tmp/v23339_bundle.tar.gz
          tar -xzf /tmp/v23339_bundle.tar.gz -C scripts
          chmod +x scripts/build_v23339_driver.sh

          cat scripts/v23340_bundle.b64.* | tr -d '\r\n' | base64 -d > /tmp/v23340_bundle.tar.gz
          gzip -t /tmp/v23340_bundle.tar.gz
          tar -xzf /tmp/v23340_bundle.tar.gz -C scripts
          chmod +x scripts/build_v23340_driver.sh

          cat scripts/v23341_source.patch.gz.b64.* | tr -d '\r\n' | base64 -d > /tmp/v23341_source.patch.gz
          echo '68d4fbb47c509bc531930af87fe8f6ab0e907b1d8055a58e4f71608bc138c0fe  /tmp/v23341_source.patch.gz' | sha256sum -c -
          gzip -t /tmp/v23341_source.patch.gz
          chmod +x scripts/build_v23341_driver.sh

          cat scripts/v23342r2_source.patch.gz.b64.* | tr -d '\r\n' | base64 -d > /tmp/v23342_source.patch.gz
          echo 'bc76854130069fb0d065fdc52f0c80df2d0e4f4fbabb5662ec9e42519847ff0b  /tmp/v23342_source.patch.gz' | sha256sum -c -
          gzip -t /tmp/v23342_source.patch.gz
          chmod +x scripts/build_v23342_r2_driver.sh

          cat scripts/v23343r2_source.patch.gz.b64.* | tr -d '\r\n' | base64 -d > /tmp/v23343_source.patch.gz
          echo '09b497e650e14458b6605b3e668d3a9dfef397def9a3258042ba793525545378  /tmp/v23343_source.patch.gz' | sha256sum -c -
          gzip -t /tmp/v23343_source.patch.gz
          chmod +x scripts/build_v23343_driver.sh

          cat scripts/v23344_source.patch.gz.b64.* | tr -d '\r\n' | base64 -d > /tmp/v23344_source.patch.gz
          echo 'c56c2e34eabbfb8179acbf529013ae17e24b3a035ed67498fcc478dbbaf057cb  /tmp/v23344_source.patch.gz' | sha256sum -c -
          gzip -t /tmp/v23344_source.patch.gz
          chmod +x scripts/build_v23344_driver.sh

          cat scripts/v23345_source.patch.gz.b64.* | tr -d '\r\n' | base64 -d > /tmp/v23345_source.patch.gz
          echo '9b4c03a03aa778b02c34fce45624170e3fa57d96a669233cb6d5acd7b2bf9000  /tmp/v23345_source.patch.gz' | sha256sum -c -
          gzip -t /tmp/v23345_source.patch.gz
          chmod +x scripts/build_v23345_driver.sh

          echo '9fccea55dd32f6a447c6b9647629762a37c79c5d0a346152cb656d1cdf320ca8  scripts/v23347_source.patch' | sha256sum -c -
          python3 -m py_compile scripts/audit_v23347_confirmed_shadow_singleton_rescue.py
          python3 scripts/fix_v23336_diagnostic_anchor.py

      - name: Build trusted v2.33.45 carrier source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/build_v23345_driver.sh

      - name: Patch build and audit v2.33.47
        run: |
          set -euo pipefail
          LIVE=upstream/extensions/youtube/src/main/java/app/spanishstudy/vot/LiveSpeakerOnline.java
          SHERPA=upstream/extensions/youtube/src/main/java/app/spanishstudy/vot/SherpaNeuralShadow.java
          CONTROLLER=upstream/extensions/youtube/src/main/java/app/spanishstudy/vot/SpanishStudyController.java
          printf '%s  %s\n' 314a7ca6ab50154329ae0bc5b6b56b7b8e066f62fd4598cecc5fc771288539ee "$LIVE" | sha256sum -c -
          printf '%s  %s\n' 2b4012c4e5353769b1d1d1927aeca3b6bcee482a3d12d2411693fbd539de5626 "$SHERPA" | sha256sum -c -
          printf '%s  %s\n' a3787e30cfa768004e5043216049708e621c050139c973fa590adb2ca2570e12 "$CONTROLLER" | sha256sum -c -
          patch --batch --forward -d upstream/extensions/youtube/src/main/java/app/spanishstudy/vot -p1 < scripts/v23347_source.patch
          printf '%s  %s\n' 39330657f9c991d23bdeb483b52f7496dcb1c02bca1a071e2628e9a98535391b "$LIVE" | sha256sum -c -
          printf '%s  %s\n' 2b4012c4e5353769b1d1d1927aeca3b6bcee482a3d12d2411693fbd539de5626 "$SHERPA" | sha256sum -c -
          printf '%s  %s\n' 7c3f375bcd4c59177d1b699851956fe734d25a0538234e7416549bfca49f94c7 "$CONTROLLER" | sha256sum -c -
          python3 scripts/audit_v23347_confirmed_shadow_singleton_rescue.py upstream
          (cd upstream && chmod +x gradlew && ./gradlew :patches:buildAndroid --no-daemon)
          python3 scripts/audit_v23312_caption_bootstrap_source.py upstream
          python3 scripts/audit_v23327_neural_payload_source.py upstream
          python3 scripts/audit_v23347_confirmed_shadow_singleton_rescue.py upstream

          rm -rf dist && mkdir -p dist
          MPP="$(find upstream/patches/build/libs -maxdepth 1 -type f -name '*.mpp' | head -n1)"
          test -n "$MPP"
          unzip -p "$MPP" extensions/youtube.mpe > dist/youtube-v23347-source-compiled.mpe
          unzip -p "$MPP" classes.dex > dist/patches-v23347-classes.dex
          unzip -p "$MPP" app/morphe/patches/youtube/video/volume/PlayerVolumeHookPatchKt.class > dist/PlayerVolumeHookPatchKt.class
          strings dist/youtube-v23347-source-compiled.mpe | grep 'Spanish Dub Study v2.33.47 confirmed-shadow singleton-rescue statistical speaker identity diagnostics'
          strings dist/youtube-v23347-source-compiled.mpe | grep 'speakerIdentityAuthority=confirmed-shadow-singleton-rescue-statistical-v23347'
          strings dist/youtube-v23347-source-compiled.mpe | grep 'speakerStatShadowBridgePolicy=singleton-only+same-confirmed-shadow-raw-profile+prior-confirmed-stat-human+no-repeated-negative;never-bootstraps-new-human'
          strings dist/youtube-v23347-source-compiled.mpe | grep 'speakerStatShadowSingletonUnions='
          echo 'd0f2b5d2508221a7dad5507ceb8b35aa1e632b4a48f8cd24e14716ae968c15dc  dist/patches-v23347-classes.dex' | sha256sum -c -
          echo '196e36771ac7d8ba1d8da1f4470e5803b9074c5e9f5bfa475a3e9c51d2010708  dist/PlayerVolumeHookPatchKt.class' | sha256sum -c -
          cp "$MPP" dist/spanish-dub-v23347-source-build-NOT-INSTALL.mpp
          cp scripts/v23347_source.patch dist/
          cp scripts/audit_v23347_confirmed_shadow_singleton_rescue.py dist/
          sha256sum dist/* > dist/SHA256SUMS.txt

      - name: Upload v2.33.47 source candidate
        uses: actions/upload-artifact@v4
        with:
          name: spanish-dub-v23347-source-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 30
