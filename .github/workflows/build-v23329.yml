name: Build Spanish Dub v2.33.37 Two-Level Human Identity

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/video-master-clock-v23329

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout custom integration
        uses: actions/checkout@v4

      - name: Checkout pinned Morphe patches
        uses: actions/checkout@v4
        with:
          repository: MorpheApp/morphe-patches
          ref: v1.41.0
          path: upstream
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Reconstruct source chain
        run: |
          set -euo pipefail
          cat scripts/v23329r3_patch.b64.* | tr -d '\r\n' | base64 -d > scripts/patch_v23329_accepted_pcm_video_master.py.gz
          cat scripts/v23329r3_audit.b64.* | tr -d '\r\n' | base64 -d > scripts/audit_v23329_accepted_pcm_video_master.py.gz
          gzip -t scripts/patch_v23329_accepted_pcm_video_master.py.gz
          gzip -t scripts/audit_v23329_accepted_pcm_video_master.py.gz

          tr -d '\r\n' < scripts/v23330_patch.b64 | base64 -d > /tmp/patch_v23330.py.gz
          tr -d '\r\n' < scripts/v23330_audit.b64 | base64 -d > /tmp/audit_v23330.py.gz
          gzip -t /tmp/patch_v23330.py.gz /tmp/audit_v23330.py.gz
          gzip -dc /tmp/patch_v23330.py.gz > scripts/patch_v23330_postwrite_register_fix.py
          gzip -dc /tmp/audit_v23330.py.gz > scripts/audit_v23330_postwrite_register_fix.py

          python3 scripts/fix_v23336_diagnostic_anchor.py
          python3 -m py_compile \
            scripts/patch_v23331_live_speaker.py \
            scripts/patch_v23331_live_speaker_r2.py \
            scripts/patch_v23331_live_speaker_r3.py \
            scripts/audit_v23331_live_speaker.py \
            scripts/patch_v23332_live_identity_collapse_fix.py \
            scripts/audit_v23332_live_identity_collapse_fix.py \
            scripts/patch_v23333_identity_stabilization.py \
            scripts/audit_v23333_identity_stabilization.py \
            scripts/patch_v23334_style_context_recovery.py \
            scripts/audit_v23334_style_context_recovery.py \
            scripts/patch_v23335_badge_translation_integrity.py \
            scripts/audit_v23335_badge_translation_integrity.py \
            scripts/patch_v23336_streaming_context.py \
            scripts/audit_v23336_streaming_context.py \
            scripts/patch_v23337_two_level_identity.py \
            scripts/audit_v23337_two_level_identity.py
          bash -n \
            scripts/build_v23331_driver.sh \
            scripts/build_v23332_driver.sh \
            scripts/build_v23333_driver.sh \
            scripts/build_v23334_driver.sh \
            scripts/build_v23335_driver.sh \
            scripts/build_v23336_driver.sh \
            scripts/build_v23337_driver.sh

      - name: Build and audit v2.33.37
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/build_v23337_driver.sh

      - name: Upload v2.33.37 source candidate
        uses: actions/upload-artifact@v4
        with:
          name: spanish-dub-v23337-source-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 30
