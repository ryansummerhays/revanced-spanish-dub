name: ChatGPT build v2.33.5 neural payload delta

on:
  push:
    branches:
      - chatgpt/v2334-tooling

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tooling branch
        uses: actions/checkout@v4

      - name: Checkout pinned Morphe 1.41.0
        uses: actions/checkout@v4
        with:
          repository: MorpheApp/morphe-patches
          ref: ef9de18f11f6f3ef842cfa49ecf657593b026e59
          path: upstream
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build v2.33.5 payload delta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/chatgpt_build_v2335_payload.sh

      - name: Upload v2.33.5 delta build
        uses: actions/upload-artifact@v4
        with:
          name: v2335-neural-payload-delta
          path: dist/
          if-no-files-found: error
          retention-days: 1
