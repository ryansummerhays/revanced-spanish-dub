name: Build Spanish Dub v2.33.27 Accepted Write PCM Clock

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/video-master-clock-v2332

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout custom integration
        uses: actions/checkout@v4

      - name: Checkout pinned Morphe patches
        uses: actions/checkout@v4
        with:
          repository: MorpheApp/morphe-patches
          ref: v1.41.0
          path: upstream
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate patch scripts
        run: |
          python3 -m py_compile \
            scripts/patch_v23319_sherpa_source_parity.py \
            scripts/audit_v23319_sherpa_source_parity.py \
            scripts/patch_v23312_caption_bootstrap_source.py \
            scripts/audit_v23312_caption_bootstrap_source.py \
            scripts/patch_v23324_video_master_clock_foundation.py \
            scripts/audit_v23324_video_master_clock_foundation.py \
            scripts/prepare_v23326_driver.py \
            scripts/patch_v23326_neural_absolute_timeline.py \
            scripts/audit_v23326_neural_absolute_timeline.py \
            scripts/patch_v23327_accepted_write_accounting.py \
            scripts/audit_v23327_accepted_write_accounting.py

      - name: Test master-clock helpers without Android
        run: |
          rm -rf /tmp/video-master-tests && mkdir -p /tmp/video-master-tests
          javac -d /tmp/video-master-tests \
            overlay/v2331/app/spanishstudy/vot/VideoSessionClock.java \
            overlay/v2331/app/spanishstudy/vot/AudioVideoTimeBridge.java \
            overlay/v2331/app/spanishstudy/vot/SpeakerTimeline.java \
            tests/VideoMasterClockFoundationTest.java
          java -cp /tmp/video-master-tests app.spanishstudy.vot.VideoMasterClockFoundationTest

      - name: Replay retained Spanish Dub source through Stage J
        run: |
          set -euo pipefail
          python3 scripts/patch_v2280_deep_diagnostics_local_diarization.py upstream .
          python3 scripts/tune_v2280_local_speaker.py upstream
          python3 scripts/audit_v2280_deep_diagnostics_local_diarization.py upstream
          python3 scripts/patch_v2290_stability.py upstream .
          python3 scripts/audit_v2290_stability.py upstream
          python3 scripts/patch_v2300_runtime_stability.py upstream .
          python3 scripts/audit_v2300_runtime_stability.py upstream
          python3 scripts/patch_v2310_conversational_subtitles.py upstream .
          python3 scripts/audit_v2310_conversational_subtitles.py upstream
          python3 scripts/patch_v2322_label_only.py upstream
          python3 scripts/audit_v2322_label_only.py upstream
          python3 scripts/patch_v2323_pcm_counter_english_source.py upstream
          python3 scripts/audit_v2323_pcm_counter_english_source.py upstream
          python3 scripts/patch_v2324_pcm_metadata_stage_b.py upstream
          python3 scripts/audit_v2324_pcm_metadata_stage_b.py upstream
          python3 scripts/patch_v2325_pcm_sample_read_stage_c.py upstream
          python3 scripts/audit_v2325_pcm_sample_read_stage_c.py upstream
          python3 scripts/patch_v2326_audiotrack_format_stage_d.py upstream
          python3 scripts/audit_v2326_audiotrack_format_stage_d.py upstream
          python3 scripts/patch_v2327_pcm16_vad_stage_e.py upstream
          python3 scripts/audit_v2327_pcm16_vad_stage_e.py upstream
          python3 scripts/patch_v2328_speaker_features_stage_f.py upstream
          python3 scripts/audit_v2328_speaker_features_stage_f.py upstream
          python3 scripts/patch_v2329_online_clustering_stage_g.py upstream
          python3 scripts/audit_v2329_online_clustering_stage_g.py upstream
          python3 scripts/patch_v23210_live_cluster_label_stage_h.py upstream
          python3 scripts/audit_v23210_live_cluster_label_stage_h.py upstream
          python3 scripts/patch_v23211_spanish_voice_toggle_stage_i.py upstream
          python3 scripts/audit_v23211_spanish_voice_toggle_stage_i.py upstream
          python3 scripts/patch_v23212_per_video_speaker_reset_stage_j.py upstream
          python3 scripts/audit_v23212_per_video_speaker_reset_stage_j.py upstream

      - name: Fetch pinned Sherpa Java compile API only
        shell: bash
        run: |
          set -euo pipefail
          AAR=/tmp/sherpa-onnx-1.13.7.aar
          curl -L --fail --retry 4 -o "$AAR" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar
          echo "c4ef49e309f24fcee5c106b8a279481aaecaabb078cd37b2cd6e9a62cc8a73c8  $AAR" | sha256sum -c -
          rm -rf /tmp/sherpa-aar && mkdir -p /tmp/sherpa-aar upstream/extensions/youtube/libs
          unzip -q "$AAR" -d /tmp/sherpa-aar
          cp /tmp/sherpa-aar/classes.jar upstream/extensions/youtube/libs/sherpa-onnx-1.13.7-classes.jar
          jar tf upstream/extensions/youtube/libs/sherpa-onnx-1.13.7-classes.jar | grep 'com/k2fsa/sherpa/onnx/OfflineSpeakerDiarization.class'
          test ! -e upstream/extensions/youtube/src/main/jniLibs/arm64-v8a/libsherpa-onnx-jni.so

      - name: Apply stable Sherpa source parity
        run: |
          python3 scripts/patch_v23319_sherpa_source_parity.py upstream .
          python3 scripts/audit_v23319_sherpa_source_parity.py upstream

      - name: Apply stable caption-bootstrap source parity
        run: |
          python3 scripts/patch_v23312_caption_bootstrap_source.py upstream
          python3 scripts/audit_v23312_caption_bootstrap_source.py upstream

      - name: Apply video-master session foundation
        run: |
          python3 scripts/patch_v23324_video_master_clock_foundation.py upstream .
          python3 scripts/audit_v23324_video_master_clock_foundation.py upstream

      - name: Apply v2.33.26 neural absolute timeline and render-clock probe
        run: |
          python3 scripts/prepare_v23326_driver.py upstream .
          python3 scripts/patch_v23326_neural_absolute_timeline.py upstream .
          python3 scripts/audit_v23326_neural_absolute_timeline.py upstream

      - name: Apply v2.33.27 accepted AudioTrack write accounting
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/v23327-debug
          python3 scripts/patch_v23327_accepted_write_accounting.py upstream . 2>&1 | tee /tmp/v23327-debug/patch.log
          patch_status=${PIPESTATUS[0]}
          if [ "$patch_status" -eq 0 ]; then
            python3 scripts/audit_v23327_accepted_write_accounting.py upstream 2>&1 | tee /tmp/v23327-debug/audit.log
            audit_status=${PIPESTATUS[0]}
          else
            audit_status=0
          fi
          printf 'patch_status=%s\naudit_status=%s\n' "$patch_status" "$audit_status" > /tmp/v23327-debug/status.txt
          if [ "$patch_status" -ne 0 ]; then exit "$patch_status"; fi
          if [ "$audit_status" -ne 0 ]; then exit "$audit_status"; fi

      - name: Upload v2.33.27 patch diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v23327-patch-failure-debug
          path: /tmp/v23327-debug/
          if-no-files-found: warn
          retention-days: 7

      - name: Build source-compiled Morphe extension candidate
        working-directory: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid --no-daemon

      - name: Re-audit final source tree
        run: |
          python3 scripts/audit_v23312_caption_bootstrap_source.py upstream
          python3 scripts/audit_v23327_accepted_write_accounting.py upstream

      - name: Extract source-built extension and package candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          MPP="$(find upstream/patches/build/libs -maxdepth 1 -type f -name '*.mpp' | head -n1)"
          test -n "$MPP"
          unzip -p "$MPP" extensions/youtube.mpe > dist/youtube-v23327-source-compiled.mpe
          test -s dist/youtube-v23327-source-compiled.mpe
          strings dist/youtube-v23327-source-compiled.mpe | grep 'SherpaNeuralShadow'
          strings dist/youtube-v23327-source-compiled.mpe | grep 'videoMasterClock=video-ms-authority'
          strings dist/youtube-v23327-source-compiled.mpe | grep 'v2.33.26-neural-only+stride4+absolute-video-projection'
          strings dist/youtube-v23327-source-compiled.mpe | grep 'Spanish Dub Study v2.33.27 accepted-write PCM clock diagnostics'
          strings dist/youtube-v23327-source-compiled.mpe | grep 'pcmWriteAccounting=post-audiotrack-write-return-value-diagnostic-only'
          strings dist/youtube-v23327-source-compiled.mpe | grep 'audioVideoSyncAcceptedVsRenderedMs='
          strings dist/youtube-v23327-source-compiled.mpe | grep 'audioVideoSyncAcceptedVsVideoMs='
          strings dist/youtube-v23327-source-compiled.mpe | grep 'pcmAdmission=unchanged-sherpa-stride4-v23327-diagnostic-only'
          cp "$MPP" dist/spanish-dub-v23327-source-build-NOT-INSTALL.mpp
          sha256sum dist/* > dist/SHA256SUMS.txt
          ls -lh dist/
          cat dist/SHA256SUMS.txt

      - name: Upload source candidate
        uses: actions/upload-artifact@v4
        with:
          name: spanish-dub-v23327-source-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 30
