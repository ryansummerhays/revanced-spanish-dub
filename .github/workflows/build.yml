name: Build custom Spanish dub patch bundle

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout custom overlay
        uses: actions/checkout@v4

      - name: Checkout pinned Morphe patches
        uses: actions/checkout@v4
        with:
          repository: MorpheApp/morphe-patches
          ref: v1.41.0
          path: upstream
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test vocabulary analyzer
        run: |
          mkdir -p /tmp/spanish-study-test
          javac -d /tmp/spanish-study-test \
            overlay/src/app/spanishstudy/vot/VocabularyEntry.java \
            overlay/src/app/spanishstudy/vot/VocabularyAnalyzer.java \
            tests/VocabularyAnalyzerTest.java
          java -cp /tmp/spanish-study-test VocabularyAnalyzerTest

      - name: Apply Spanish study overlay
        run: python3 scripts/apply_overlay.py upstream overlay/src

      - name: Build Morphe patch bundle
        working-directory: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid --no-daemon

      - name: Prepare bundle and checksum
        run: |
          mkdir -p dist
          cp upstream/patches/build/libs/*.mpp dist/
          cd dist
          sha256sum *.mpp > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Upload custom patch bundle
        uses: actions/upload-artifact@v4
        with:
          name: revanced-spanish-dub-morphe-v1.41.0
          path: dist/
          if-no-files-found: error
          retention-days: 30
