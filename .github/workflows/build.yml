name: Build Spanish Dub Study v2.3.2 patch bundle

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout custom overlay
        uses: actions/checkout@v4

      - name: Checkout pinned Morphe patches
        uses: actions/checkout@v4
        with:
          repository: MorpheApp/morphe-patches
          ref: v1.41.0
          path: upstream
          persist-credentials: false

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Test study helpers
        run: |
          mkdir -p /tmp/spanish-study-test
          javac -d /tmp/spanish-study-test \
            overlay/src/app/spanishstudy/vot/VocabularyEntry.java \
            overlay/src/app/spanishstudy/vot/VocabularyAnalyzer.java \
            overlay/src/app/spanishstudy/vot/SemanticClauseSplitter.java \
            overlay/src/app/spanishstudy/vot/TranslationAlignmentGuard.java \
            overlay/src/app/spanishstudy/vot/TranscriptCorrectionStore.java \
            overlay/src/app/spanishstudy/vot/SourceExpressionMath.java \
            tests/VocabularyAnalyzerTest.java \
            tests/SemanticClauseSplitterTest.java \
            tests/TranslationAlignmentGuardTest.java \
            tests/TranscriptCorrectionStoreTest.java \
            tests/SourceExpressionMathTest.java \
            tests/WholeTranscriptDesignTest.java
          java -cp /tmp/spanish-study-test VocabularyAnalyzerTest
          java -cp /tmp/spanish-study-test app.spanishstudy.vot.SemanticClauseSplitterTest
          java -cp /tmp/spanish-study-test app.spanishstudy.vot.TranslationAlignmentGuardTest
          java -cp /tmp/spanish-study-test app.spanishstudy.vot.TranscriptCorrectionStoreTest
          java -cp /tmp/spanish-study-test app.spanishstudy.vot.SourceExpressionMathTest
          java -cp /tmp/spanish-study-test WholeTranscriptDesignTest

      - name: Apply Spanish study v2.3.2 overlay
        run: |
          python3 scripts/apply_overlay.py upstream overlay/src
          python3 scripts/patch_provider_picker.py upstream
          python3 scripts/patch_video_context.py upstream
          python3 scripts/patch_natural_speech_boundaries.py upstream
          python3 scripts/patch_bilingual_subtitles.py upstream
          python3 scripts/patch_autodub_timeline.py upstream
          python3 scripts/patch_quickstart_gemini.py upstream
          python3 scripts/patch_autostart_session.py upstream
          python3 scripts/patch_live_speech_rate.py upstream
          python3 scripts/patch_translation_language_guard.py upstream
          python3 scripts/patch_source_expression.py upstream

      - name: Build Morphe patch bundle
        working-directory: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid --no-daemon

      - name: Rebrand and package v2.3.2 bundle
        run: |
          mkdir -p dist
          python3 - <<'PY'
          import glob, time, zipfile
          srcs = glob.glob('upstream/patches/build/libs/*.mpp')
          if len(srcs) != 1:
              raise SystemExit(f'Expected one MPP, found {srcs}')
          src = srcs[0]
          dst = 'dist/spanish-dub-study-patches-v2.3.2.mpp'
          manifest = f'''Manifest-Version: 1.0\nName: Spanish Dub Study Patches v2.3.2\nDescription: Context-aware transcript reliability update. Gemini now receives YouTube title, creator/channel and a capped description from the same Innertube response already used to locate captions, plus the complete raw timed transcript. Its prompt explicitly infers domain vocabulary, names, slang, game/technical jargon and likely ASR mistakes before translating, while keeping the raw source as an immutable alignment checksum. A conservative correctedSource field can repair high-confidence English caption mistakes for display (for example niche item names) without changing source timing/IDs. Long/multi-sentence events are recursively split at genuine punctuation anywhere in the event, punctuation-free ASR uses real caption pauses more effectively, and unusually long natural subtitles wrap instead of clipping. Rejected untranslated-Spanish slots receive a one-line rescue translation before falling silent. Retains conservative source-expression matching, immutable source-ID translation alignment, portrait-responsive placement, live speech-rate changes, per-video autostart, persistent settings and vocabulary tools based on Morphe 1.41.0\nVersion: 2.3.2\nTimestamp: {int(time.time()*1000)}\nSource: https://github.com/ryansummerhays/revanced-spanish-dub\nAuthor: ryansummerhays\nContact: na\nWebsite: https://github.com/ryansummerhays/revanced-spanish-dub\nLicense: GNU General Public License v3.0, with additional GPL section 7 requirements\nPatcher-Version: 1.10.0\n\n'''.encode()
          with zipfile.ZipFile(src, 'r') as zin, zipfile.ZipFile(dst, 'w') as zout:
              for info in zin.infolist():
                  data = manifest if info.filename == 'META-INF/MANIFEST.MF' else zin.read(info.filename)
                  zout.writestr(info, data)
          print(dst)
          PY
          cd dist
          sha256sum *.mpp > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Upload custom patch bundle
        uses: actions/upload-artifact@v4
        with:
          name: spanish-dub-study-patches-v2.3.2
          path: dist/
          if-no-files-found: error
          retention-days: 30
